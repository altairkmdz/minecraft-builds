name: WallixSpawn
main: dev.altair.WallixSpawn
version: 1.0.0
api-version: 1.19
description: Плагин для установки и телепортации на спавн.
author: Altair
commands:
  setspawn:
    description: Установить точку спавна
    usage: /<command>
    permission: wallixspawn.setspawn
  spawn:
    description: Телепортироваться на спавн
    usage: /<command>
    permission: wallixspawn.spawn
permissions:
  wallixspawn.setspawn:
    description: Позволяет использовать /setspawn
    default: op
  wallixspawn.spawn:
    description: Позволяет использовать /spawn
    default: true