name: WallixSpawn
version: 1.0.0
main: dev.altair.WallixSpawn
api-version: 1.19
description: Плагин для установки и телепортации к спавну.
author: Altair
commands:
  setspawn:
    description: Установить точку спавна
    usage: /<command>
    permission: wallixspawn.setspawn
  spawn:
    description: Телепортироваться к спавну
    usage: /<command>
    permission: wallixspawn.spawn
permissions:
  wallixspawn.setspawn:
    description: Позволяет использовать /setspawn
    default: op
  wallixspawn.spawn:
    description: Позволяет использовать /spawn
    default: true